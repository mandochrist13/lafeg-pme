# Empêche pnpm de relancer une vérification/installation des dépendances
# avant chaque `pnpm run` (sinon `pnpm run dev` échoue à cause des build scripts ignorés).
verifyDepsBeforeRun: false

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - core-js-pure
  - sharp
  - tree-sitter
  - tree-sitter-json

packages:
  - ./apps/*
  - ./packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
