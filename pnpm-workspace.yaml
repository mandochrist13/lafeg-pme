# Empêche pnpm de relancer une vérification/installation des dépendances
# avant chaque `pnpm run` (sinon `pnpm run dev` échoue à cause des build scripts ignorés).
verifyDepsBeforeRun: false

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - core-js-pure
  - sharp
  - tree-sitter
  - tree-sitter-json

packages:
  - ./apps/*
  - ./packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

allowBuilds:
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
  '@tree-sitter-grammars/tree-sitter-yaml': set this to true or false
  core-js-pure: set this to true or false
  prisma: set this to true or false
  sharp: set this to true or false
  tree-sitter: set this to true or false
  tree-sitter-json: set this to true or false
